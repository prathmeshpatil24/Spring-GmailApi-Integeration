server.port=8080
spring.application.name=Gmail-Integeration
spring.datasource.url=jdbc:mysql://localhost:3306/spring_gmail_integration
spring.datasource.username=root
spring.datasource.password=system@1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=none

# Google OAuth credentials
google.credentials.file.path=/credentials.json
google.redirect.uri=http://localhost:8080/oauth2/callback

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
